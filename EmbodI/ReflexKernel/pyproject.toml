[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexkernel"
version = "0.1.0"
description = "Trainable low-level embodiment / nervous-system kernel for higher-level AI. Perception, fast reflexes, imitation+RL learning, visualization, and clean interfaces."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary / Internal EmbodI Research"}
authors = [
  {name = "EmbodI ReflexKernel Contributors"}
]
keywords = ["embodiment", "robotics", "reflex", "ai", "nervous-system", "imitation-learning", "reinforcement-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "pydantic>=2.0,<3",
  "pyyaml>=6.0",
  "numpy>=1.23",
  "rich>=13.0",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
viz = ["pygame>=2.5"]
vision = ["opencv-python>=4.8", "mediapipe>=0.10.0"]
audio = ["sounddevice>=0.4"]
ml = ["sentence-transformers>=2.2", "scikit-learn>=1.3"]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "websockets>=11.0", "httpx>=0.24"]
mcp = ["mcp>=1.0"]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "mypy>=1.5",
  "ruff>=0.1",
  "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/embodi/reflexkernel"  # placeholder
Documentation = "./PLAN.md"
Issues = "https://github.com/embodi/reflexkernel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reflexkernel" = ["py.typed"]

[project.scripts]
reflexkernel-demo = "reflexkernel.scripts.demo:main"
reflexkernel-mcp = "reflexkernel.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39", "py310"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false   # relax during early dev; tighten later
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
