[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexkernel"
version = "0.1.0"
description = "Trainable low-level embodiment / nervous-system kernel for higher-level AI. Perception, fast reflexes, imitation+RL learning, visualization, and clean interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Internal EmbodI Research"}
authors = [
  {name = "EmbodI ReflexKernel Contributors"}
]
keywords = ["embodiment", "robotics", "reflex", "ai", "nervous-system", "imitation-learning", "reinforcement-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "pydantic>=2.0,<3",
  "pyyaml>=6.0",
  "numpy>=1.23,<3",
  "rich>=13.0",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
viz = ["pygame>=2.5"]
vision = ["opencv-python>=4.8", "mediapipe>=0.10.0"]
audio = ["sounddevice>=0.4"]
ml = ["sentence-transformers>=2.2", "scikit-learn>=1.3"]
server = [
  "fastapi>=0.100,<1",
  "uvicorn[standard]>=0.23,<1",
  "websockets>=11.0,<17",
  "httpx>=0.24,<1",
]
# Official MCP SDK (FastMCP). Pin 1.x — mcp 2.x dropped mcp.server.fastmcp (broke Lab MCP / blmcp).
mcp = ["mcp>=1.2.0,<2"]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "mypy>=1.5",
  "ruff>=0.1",
  "black>=23.0",
]
# Desktop / Pi full stack for Saddle + audio + tests (vision/ml still optional — heavy).
# Keep in sync with dev+server+audio+viz+mcp extras above.
all = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "mypy>=1.5",
  "ruff>=0.1",
  "black>=23.0",
  "fastapi>=0.100,<1",
  "uvicorn[standard]>=0.23,<1",
  "websockets>=11.0,<17",
  "httpx>=0.24,<1",
  "sounddevice>=0.4",
  "pygame>=2.5",
  "mcp>=1.2.0,<2",
]

[project.urls]
Homepage = "https://github.com/embodi/reflexkernel"  # placeholder
Documentation = "./PLAN.md"
Issues = "https://github.com/embodi/reflexkernel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reflexkernel" = ["py.typed"]

[project.scripts]
reflexkernel-demo = "reflexkernel.scripts.demo:main"
reflexkernel-mcp = "reflexkernel.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false   # relax during early dev; tighten later
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
